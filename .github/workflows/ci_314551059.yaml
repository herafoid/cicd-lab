name: CI Pipeline - 314551059

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  checks: write        # ← 這行是關鍵，允許寫入 Check Runs
  pull-requests: write # ← 如果要在 PR 顯示留言也需要這行

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npm run format:check

      - name: Run tests
        run: npm test -- --reporter=junit --outputFile=test-results/results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/results.xml