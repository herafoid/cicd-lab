name: CI Pipeline

# 設定在 push 時自動執行 [cite: 7]
on:
  push:
    branches: ['main', 'master']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 可依專案需求調整版本

      # 3. 安裝依賴套件
      - name: Install dependencies
        run: npm install

      # 4. 執行 Prettier 檢查 [cite: 10]
      - name: Prettier check
        run: npx prettier --check .

      # 5. 執行 TypeScript typecheck [cite: 9]
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # 6. 執行測試並產出報告 (修正為 Vitest 專用參數) [cite: 11]
      - name: Run Tests
        run: npm test -- --reporter=default --reporter=junit --outputFile=./test-report.xml

      # 7. 將測試結果顯示於 GitHub actions 結果頁面 [cite: 13]
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure() # 確保測試失敗也能產出報告
        with:
          name: Vitest Tests
          path: test-report.xml # 讀取剛剛產出的 xml
          reporter: jest-junit # dorny 依然用這個名稱來解析標準 JUnit 格式
