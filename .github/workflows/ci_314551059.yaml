name: CI Pipeline

# 設定在 push 時自動執行 
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 可依專案需求調整版本

      # 3. 安裝依賴套件
      - name: Install dependencies
        run: npm install

      # 4. 執行 Prettier 檢查 [cite: 10]
      # 注意：需確認 package.json 內的 script 名稱，或直接用 npx
      - name: Prettier check
        run: npx prettier --check .

      # 5. 執行 TypeScript typecheck [cite: 9]
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # 6. 執行測試並產出報告 [cite: 11]
      # 這裡加上 --reporters 選項來產生 XML 報告，以便後續套件讀取 
      - name: Run Tests
        run: npm test -- --reporters="default" --reporters="jest-junit"
        env:
          JEST_JUNIT_OUTPUT_DIR: "./reports"
          JEST_JUNIT_OUTPUT_NAME: "test-report.xml"

      # 7. 將測試結果顯示於 GitHub actions 結果頁面 [cite: 13, 14, 15]
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure() # 確保測試失敗也能產出報告
        with:
          name: Jest Tests
          path: reports/test-report.xml
          reporter: jest-junit