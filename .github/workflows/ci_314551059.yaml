name: CI Pipeline

# 設定在 push 時自動執行
on:
  push:
    branches: ['main', 'master']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 關鍵：授權給套件，讓它有權限在 GitHub 頁面上留下測試報告
    permissions:
      checks: write
      contents: read

    steps:
      # 1. 取得專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. 安裝依賴套件
      - name: Install dependencies
        run: npm install

      # 4. 執行 Prettier 檢查
      - name: Prettier check
        run: npx prettier --check .

      # 5. 執行 TypeScript typecheck
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # 6. 繞過 npm，直接用 npx vitest 執行測試並產出報告
      - name: Run Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./test-report.xml

      # 7. 將測試結果顯示於 GitHub actions 結果頁面
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure() # 確保測試失敗也能產出報告
        with:
          name: Vitest Tests
          path: test-report.xml
          reporter: jest-junit
